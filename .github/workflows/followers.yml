name: Hourly followers snapshot

# Every hour: fetch the follower count from api.fxtwitter.com (no secrets, stdlib only),
# rebuild data.json, commit data.json + data/ if anything changed, then deploy Pages.
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC (GitHub cron is UTC; scheduled runs can be delayed)
  workflow_dispatch:

concurrency:
  group: followers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Snapshot followers, rebuild data.json, commit if changed
        id: commit
        run: |
          git config user.name "cursor/bot"
          git config user.email "cursor-bot@users.noreply.github.com"
          # Up to 3 attempts: if someone else (e.g. an agent ingest run) pushed in the meantime,
          # start again from the latest main and re-run the collector on top of it (no merge conflicts).
          for i in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python3 collect.py followers-only
            git add data.json data/
            if git diff --cached --quiet; then
              echo "No changes."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "data: hourly followers snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $i), retrying on latest main..."
            sleep $((i * 5))
          done
          echo "Could not push after 3 attempts" >&2
          exit 1

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: main
