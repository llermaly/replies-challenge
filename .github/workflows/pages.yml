name: Deploy to GitHub Pages

# Deploys the static site (index.html + data.json + data/) to GitHub Pages.
# - push to main: normal deploys when you commit changes
# - workflow_dispatch: manual deploy from the Actions tab
# - workflow_call: used by followers.yml right after its hourly commit, because a commit
#   pushed with GITHUB_TOKEN does NOT trigger other `push` workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or SHA to deploy (defaults to the triggering ref)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # An explicit ref makes checkout take the branch tip, so the commit just pushed by
          # followers.yml is included (github.sha would be the older commit that started the run).
          ref: ${{ inputs.ref || github.ref }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
